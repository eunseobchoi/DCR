[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcr-research"
version = "0.1.0"
description = "Disagreement-Complement Refinement (DCR) for multi-centre polyp segmentation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0", "torchvision>=0.15", "transformers>=4.30",
  "numpy", "scipy", "pandas", "pyarrow", "opencv-python", "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dcr = "dcr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
